name: Token Integrity Check

on:
  push:
    branches: [main, staging]
    paths:
      - 'src/components/**'
      - 'tokens.json'
      - 'scripts/check-tokens.mjs'
  pull_request:
    branches: [main, staging]
    paths:
      - 'src/components/**'
      - 'tokens.json'
      - 'scripts/check-tokens.mjs'

jobs:
  token-check:
    name: No hardcoded design values
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run token integrity check
        run: node scripts/check-tokens.mjs
